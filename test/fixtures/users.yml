# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html
#
# Every user needs a unique email: Devise adds a unique index on users.email,
# so two fixtures with a blank email make every test fail before it runs.

one:
  email: fixture_editor@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password") %>
  roles: editor

two:
  email: fixture_reader@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password") %>
  roles: user
